
name: Build Cafe Empire APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CafeEmpireAndroid_Project_v1.2.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q CafeEmpireAndroid_Project_v1.2.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/CafeEmpireAndroid_v1_1 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cafe-Empire-APK
          path: extracted/CafeEmpireAndroid_v1_1/app/build/outputs/apk/debug/app-debug.apk
